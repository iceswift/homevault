<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">HomeVault</title>
  <desc id="description">Encrypted home-server backups with a terminal interface. Linux preview built around Restic and rclone.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#101d32"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#surface)"/>
  <circle cx="1100" cy="30" r="190" fill="#2563eb" opacity=".07"/>
  <circle cx="1130" cy="250" r="130" fill="#22d3ee" opacity=".05"/>
  <rect x="56" y="60" width="112" height="112" rx="28" fill="#142c43" stroke="#30546c"/>
  <rect x="84" y="105" width="56" height="43" rx="10" fill="none" stroke="url(#accent)" stroke-width="4"/>
  <path d="M97 104V92a15 15 0 0 1 30 0v12" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="112" cy="124" r="4" fill="#67e8f9"/>
  <path d="M112 128v6" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <text x="202" y="115" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">HomeVault</text>
  <text x="205" y="151" fill="#b5c6dc" font-family="Segoe UI,Arial,sans-serif" font-size="21">Your home server. Your backups. Your recovery.</text>
  <rect x="941" y="65" width="202" height="34" rx="17" fill="#142d42" stroke="#30546c"/>
  <text x="1042" y="87" text-anchor="middle" fill="#a5e5f3" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">LINUX PREVIEW</text>
  <path d="M56 211h1088" stroke="#26364b"/>
  <text x="58" y="246" fill="#8ea5bf" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing=".6">TERMINAL FIRST</text>
  <text x="450" y="246" text-anchor="middle" fill="#8ea5bf" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing=".6">RESTIC ENCRYPTION</text>
  <text x="820" y="246" text-anchor="middle" fill="#8ea5bf" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing=".6">RCLONE TRANSPORT</text>
  <text x="1142" y="246" text-anchor="end" fill="#8ea5bf" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing=".6">MIT LICENSE</text>
</svg>
