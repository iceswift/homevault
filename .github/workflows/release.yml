name: Draft prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Verify and build
        run: |
          go test -race ./...
          go vet ./...
          python3 scripts/verify-systemd.py
          python3 scripts/fetch-test-restic.py "$RUNNER_TEMP/tools"
          HOMEVAULT_TEST_RESTIC="$RUNNER_TEMP/tools/restic" go test ./integration -count=1
          python3 scripts/package-release.py --version "$GITHUB_REF_NAME" --output "$RUNNER_TEMP/dist"
      - name: Create reviewable draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --verify-tag --draft --prerelease --title "$GITHUB_REF_NAME" --notes 'Experimental Linux build. Verify checksums and complete a restore drill before use. Review release notes before publishing.'
