name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting, unit tests and static analysis
        run: |
          test -z "$(gofmt -l cmd internal integration)"
          go test -race ./...
          go vet ./...
          python3 scripts/verify-systemd.py
      - name: Real encrypted local fixtures
        run: |
          python3 scripts/fetch-test-restic.py "$RUNNER_TEMP/homevault-tools"
          HOMEVAULT_TEST_RESTIC="$RUNNER_TEMP/homevault-tools/restic" go test ./integration -count=1 -v
      - name: Build Linux packages and checksums
        run: python3 scripts/package-release.py --version "dev-${GITHUB_SHA:0:12}" --output "$RUNNER_TEMP/homevault-dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homevault-linux-preview
          path: ${{ runner.temp }}/homevault-dist/*
          if-no-files-found: error
          retention-days: 14
