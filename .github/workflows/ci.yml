name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
      - name: Formatting, unit tests and static analysis
        run: |
          test -z "$(gofmt -l cmd internal integration)"
          go test -race ./...
          go vet ./...
          python3 scripts/verify-systemd.py
      - name: Real encrypted local fixtures
        run: |
          python3 scripts/fetch-test-restic.py "$RUNNER_TEMP/homevault-tools"
          python3 scripts/fetch-test-age.py "$RUNNER_TEMP/homevault-age-tools"
          HOMEVAULT_TEST_RESTIC="$RUNNER_TEMP/homevault-tools/restic" HOMEVAULT_TEST_AGE="$RUNNER_TEMP/homevault-age-tools/age" go test ./internal/recovery ./integration -count=1 -v
      - name: Build Linux packages and checksums
        run: python3 scripts/package-release.py --version "dev-${GITHUB_SHA:0:12}" --output "$RUNNER_TEMP/homevault-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: homevault-linux-preview
          path: ${{ runner.temp }}/homevault-dist/*
          if-no-files-found: error
          retention-days: 14
