{
  "name": "Setup or usage question",
  "description": "Ask for help after checking the Quick Start and guides.",
  "title": "[Help] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "This issue is public. Use generated data and redact identifying details. Do not attach keys, OAuth JSON/tokens, rclone.conf, .env, webhook URLs, database dumps or backup archives. Suspected vulnerabilities: [report privately](https://github.com/iceswift/homevault/security/advisories/new)."
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "HomeVault version or commit",
        "description": "Output of homevault version, or the full source commit."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "goal",
      "attributes": {
        "label": "Goal and environment",
        "description": "Describe the task, OS/architecture and relevant tool versions without account identifiers."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "attempt",
      "attributes": {
        "label": "What you tried and where you got stuck",
        "description": "Link the guide/step and give the smallest redacted command/error. Do not paste credentials or full configuration."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "question",
      "attributes": {
        "label": "Question",
        "description": "What needs clarification?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "privacy",
      "attributes": {
        "label": "Before submitting",
        "options": [
          {
            "label": "I removed credentials, private configuration and real application/backup data from this report.",
            "required": true
          }
        ]
      }
    }
  ]
}
